name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0). Leave blank to just build without creating a release'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Optional code signing: add both as repository secrets to sign the exe. SIGNING_CERT_PFX is
      # the .pfx file as base64 (e.g. [Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx'))).
      SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: >
          dotnet publish src/HpVictusControl/HpVictusControl.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Sign
        if: env.SIGNING_CERT_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish/HpVictusControl.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
          Remove-Item $pfx

      - name: Checksum and winget manifests
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 publish/HpVictusControl.exe).Hash
          "$hash  HpVictusControl.exe" | Set-Content publish/HpVictusControl.exe.sha256 -Encoding ascii
          if ($env:RELEASE_TAG -like 'v*') {
            ./tools/New-WingetManifest.ps1 -Version $env:RELEASE_TAG.TrimStart('v') -ExePath publish/HpVictusControl.exe -OutDir publish/winget
            Compress-Archive -Path publish/winget/manifests -DestinationPath publish/winget-manifests.zip
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HpVictusControl-win-x64
          path: |
            publish/HpVictusControl.exe
            publish/HpVictusControl.exe.sha256

      - name: Create Release
        if: (github.event_name == 'workflow_dispatch' && inputs.version != '') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            publish/HpVictusControl.exe
            publish/HpVictusControl.exe.sha256
            publish/winget-manifests.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
